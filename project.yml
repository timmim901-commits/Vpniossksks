name: Orbit
options:
  bundleIdPrefix: com.timmim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # --- меняется в одном месте ---
    BASE_BUNDLE_ID: com.timmim.vpn
    APP_GROUP_ID: group.com.timmim.vpn
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - target: OrbitTunnel
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        BasePackageIdentifier: $(BASE_BUNDLE_ID)
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Сканирование QR-кодов с профилями
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(BASE_BUNDLE_ID).import
            CFBundleURLSchemes: [sub, orbit, sing-box, clash, clashmeta, v2rayng, hiddify, happ, shadowrocket, vless, vmess, trojan, ss, hysteria2, hy2, tuic, anytls, socks, socks5]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    entitlements:
      path: App/Orbit.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  OrbitTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
    dependencies:
      - framework: Libbox.xcframework
        embed: false
        link: true
      - sdk: NetworkExtension.framework
      - sdk: UserNotifications.framework
      - sdk: libresolv.tbd
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Orbit Tunnel
        BasePackageIdentifier: $(BASE_BUNDLE_ID)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/OrbitTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).tunnel
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
        SKIP_INSTALL: YES
